<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Terminal</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- Pending Approval Screen -->
  <div id="pending-screen" class="screen pending-screen">
    <div class="pending-card">
      <div class="pending-header">
        <svg class="pending-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        <h1>Web Terminal</h1>
        <p>Waiting for approval</p>
      </div>

      <div class="approval-section">
        <p class="approval-label">Enter this code in the WebTerminal app:</p>
        <div id="approval-code" class="approval-code">------</div>
        <p class="approval-hint">Open the app and approve this session to connect</p>
      </div>

      <div class="spinner"></div>
      <p id="status-text" class="status-text">Waiting for approval in the app...</p>
      <p id="error-text" class="error-text"></p>
    </div>
  </div>

  <!-- Terminal Screen -->
  <div id="terminal-screen" class="screen terminal-screen">
    <div id="tabs-container" class="tabs-container">
      <button class="new-tab-btn" title="New Terminal">+</button>
    </div>
    <div id="terminal-container" class="terminal-container"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
