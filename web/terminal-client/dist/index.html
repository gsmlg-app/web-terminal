<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Terminal</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- Authentication Screen -->
  <div id="auth-screen" class="screen auth-screen">
    <div class="auth-card">
      <div class="auth-header">
        <svg class="auth-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <h1>Web Terminal</h1>
        <p>Enter your access token to connect</p>
      </div>

      <div class="auth-form">
        <input
          type="text"
          id="token-input"
          class="token-input"
          placeholder="Paste your access token here"
          autocomplete="off"
          spellcheck="false"
        >
        <button id="connect-btn" class="connect-btn">Connect</button>
      </div>

      <p id="status-text" class="status-text"></p>
      <p id="error-text" class="error-text"></p>

      <div class="auth-footer">
        <p>Get a token from the Web Terminal app on your device</p>
      </div>
    </div>
  </div>

  <!-- Pending Approval Screen -->
  <div id="pending-screen" class="screen pending-screen">
    <div class="pending-card">
      <div class="spinner"></div>
      <h2>Waiting for Approval</h2>
      <p>Please approve this connection in the Web Terminal app</p>
      <p class="pending-hint">Check your device for the approval notification</p>
    </div>
  </div>

  <!-- Terminal Screen -->
  <div id="terminal-screen" class="screen terminal-screen">
    <div id="tabs-container" class="tabs-container">
      <button class="new-tab-btn" title="New Terminal">+</button>
    </div>
    <div id="terminal-container" class="terminal-container"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
