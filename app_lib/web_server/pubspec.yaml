name: web_server
description: Shelf web server with WebSocket support for remote terminal access
version: 1.0.0
publish_to: "none"

environment:
  sdk: ">=3.6.0 <4.0.0"
resolution: workspace

dependencies:
  shelf: ^1.4.1
  shelf_web_socket: ^2.0.0
  shelf_static: ^1.1.2
  shelf_router: ^1.1.4
  web_socket_channel: ^3.0.0
  crypto: ^3.0.3
  uuid: any
  terminal_core: any
  terminal_hosts: any
  app_logging: any

dev_dependencies:
  test: ^1.26.0
  flutter_lints: ^6.0.0
