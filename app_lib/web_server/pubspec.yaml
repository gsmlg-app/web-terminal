name: web_server
description: Shelf web server with WebSocket support for remote terminal access
version: 1.0.0
publish_to: "none"

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.32.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  shelf: ^1.4.2
  shelf_web_socket: ^3.0.0
  shelf_static: ^1.1.3
  shelf_router: ^1.1.4
  web_socket_channel: ^3.0.3
  crypto: ^3.0.7
  uuid: ^4.6.0
  terminal_core: any
  terminal_hosts: any
  app_logging: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
