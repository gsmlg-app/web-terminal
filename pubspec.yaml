name: web_terminal
description: "The Flutter based terminal emulator and more!"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

workspace:
  - app_lib/database
  - app_lib/theme
  - app_lib/locale
  - app_lib/logging
  - app_lib/terminal_core
  - app_lib/terminal_hosts
  - app_lib/secure_storage
  - app_bloc/theme
  - app_bloc/connection
  - app_bloc/ssh_key
  - app_bloc/ssh_host
  - app_bloc/terminal_tab
  - app_bloc/terminal_settings
  - app_bloc/shell_profile
  - app_bloc/web_session
  - app_lib/web_server
  - app_widget/adaptive
  - app_widget/artwork
  - app_widget/feedback
  - app_widget/web_view
  - app_widget/terminal_settings
  - app_widget/terminal_tabs
  - app_widget/xterm
  - app_widget/terminal_plugin
  - app_widget/starter_plugin
  - app_widget/file_manager_plugin
  - app_widget/web_server_settings
  - app_plugin/client_info/client_info
  - app_plugin/client_info/client_info_platform_interface
  - app_plugin/client_info/client_info_android
  - app_plugin/client_info/client_info_ios
  - app_plugin/client_info/client_info_linux
  - app_plugin/client_info/client_info_macos
  - app_plugin/client_info/client_info_windows
  - app_plugin/pty
  - app_plugin/android_shell
  - app_plugin/ios_shell
  - app_lib/security
  - app_lib/ssh
  - app_lib/utils
  - third_party/flex_tabs

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  logging: ^1.3.0

  go_router: ^18.0.2

  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0

  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  path: ^1.9.1

  duskmoon_ui: ^1.11.1

  cupertino_icons: ^2.0.0
  flutter_svg: ^2.3.0
  lottie: ^3.6.1
  google_fonts: ^9.0.0

  # Terminal emulation
  xterm: any
  flutter_pty: any

  # Code editor and highlighting
  code_text_field: ^1.1.0
  highlight: ^0.7.0
  flutter_highlight: ^0.7.0

  # Data grid
  syncfusion_flutter_datagrid: ^35.1.40+1

  # Security
  flutter_secure_storage: ^10.3.4

  # Window and UI
  window_manager: ^0.5.2
  macos_ui: ^2.2.2
  context_menus: ^2.0.0+1
  flex_tabs: any
  font_awesome_flutter: ^11.0.0
  flutter_acrylic: ^1.1.4

  # Utilities
  file: ^7.0.1
  uuid: ^4.6.0
  meta: ^1.19.0
  collection: ^1.19.1

  # workspace packages
  app_database: any
  app_theme: any
  app_locale: any
  theme_bloc: any
  ssh_key_bloc: any
  ssh_host_bloc: any
  terminal_tab_bloc: any
  terminal_settings_bloc: any
  shell_profile_bloc: any
  app_artwork: any
  app_client_info: any
  app_feedback: any
  app_adaptive_widgets: any
  app_logging: any
  app_web_view: any
  terminal_core: any
  terminal_hosts: any
  terminal_tabs: any
  terminal_settings: any
  terminal_plugin: any
  starter_plugin: any
  file_manager_plugin: any
  web_server: any
  web_session_bloc: any
  web_server_settings: any

  # External packages from original monorepo (copied to third_party)
  app_security: any
  app_ssh: any
  app_utils: any
  app_secure_storage: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  test: ^1.31.1
  analyzer: ^13.3.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

  flutter_lints: ^6.0.0

  build_runner: ^2.16.1

  # Code generation
  go_router_builder: ^4.5.0

  # App packaging and icons
  flutter_launcher_icons: ^0.14.4
  icons_launcher: ^3.1.0
  msix: ^3.18.0

  melos: ^8.9.0
  mason: ^0.1.3
  mason_cli: ^0.1.4
  dependency_validator: ^5.1.0

dependency_overrides:
  cli_util: ^0.6.0

flutter:
  generate: false
  uses-material-design: true
  assets:
    - web/terminal-client/dist/index.html
    - web/terminal-client/dist/app.js
    - web/terminal-client/dist/app.css
    - web/terminal-client/dist/styles.css

# generate icon with `dart run flutter_launcher_icons:main``
flutter_launcher_icons:
  image_path: "app_widget/artwork/assets/icon/app-icon.png"
  android: true
  ios: true
  min_sdk_android: 21
  windows:
    generate: true
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true

melos:
  name: web_terminal
  command:
    version:
      # Only allow versioning to happen on main branch.
      branch: main
      # Generates a link to a prefilled GitHub release creation page.
      releaseUrl: true

  scripts:
    prepare:
      description: Prepare project with `bootstrap`, `build_runner build` and `gen-l10n`
      steps:
        - melos bootstrap
        - melos run gen-l10n
        - melos run build-runner

    build-runner:
      exec:
        command: dart run build_runner build
        orderDependents: true
      packageFilters:
        dependsOn: build_runner
      description: Run `dart/flutter analyze` for all packages.

    analyze:
      description: Run `dart/flutter analyze` for all packages.
      steps:
        - melos run analyze:dart
        - melos run analyze:flutter

    analyze:dart:
      exec:
        command: dart analyze --fatal-warnings
        concurrency: 1
        orderDependents: true
      packageFilters:
        flutter: false
      description: Run `dart analyze` for non-Flutter packages.

    analyze:flutter:
      exec:
        command: flutter analyze --fatal-warnings
        concurrency: 1
        orderDependents: true
      packageFilters:
        flutter: true
      description: Run `flutter analyze` for Flutter packages.

    fix:
      exec:
        command: dart fix . --apply
        orderDependents: true
      description: Run `dart fix` for all packages.

    fix-dry-run:
      exec:
        command: dart fix . --dry-run
        orderDependents: true
      description: Run `dart fix` in dry-run mode for all packages.

    format:
      exec:
        command: dart format .
        orderDependents: true
      description: Run `dart format` for all packages.

    format-check:
      exec:
        command: dart format . --set-exit-if-changed
        orderDependents: true
      description: Run `dart format` checks for all packages.

    upgrade:
      exec:
        command: dart pub upgrade --major-versions
        orderDependents: true
      description: Run `flutter pub upgrade` update dependencies in all packages.

    outdated:
      exec:
        command: dart pub outdated
        orderDependents: true
      description: Run `flutter pub outdated` check outdated dependencies in all packages.

    validate-dependencies:
      run: dart run dependency_validator
      description: Run `dart run dependency_validator` check dependencies usage.

    test:
      description: Run Flutter tests for all packages (ignores packages without tests).
      steps:
        - melos run test:dart
        - melos run test:flutter

    test:dart:
      exec:
        command: dart test
        orderDependents: true
        failFast: true
      packageFilters:
        flutter: false
        dirExists: test

    test:flutter:
      exec:
        command: flutter test
        orderDependents: true
        failFast: true
      packageFilters:
        flutter: true
        dirExists: test

    gen-l10n:
      exec:
        command: flutter gen-l10n
        orderDependents: true
      packageFilters:
        flutter: true
        fileExists: l10n.yaml
      description: Generate localization files from ARB files.

