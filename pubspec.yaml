name: web_terminal
description: "The Flutter based terminal emulator and more!"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

workspace:
  - app_lib/database
  - app_lib/theme
  - app_lib/locale
  - app_lib/provider
  - app_lib/logging
  - app_lib/terminal_core
  - app_lib/terminal_hosts
  - app_bloc/theme
  - app_bloc/connection
  - app_bloc/ssh_key
  - app_bloc/ssh_host
  - app_bloc/terminal_tab
  - app_widget/adaptive
  - app_widget/artwork
  - app_widget/feedback
  - app_widget/web_view
  - app_widget/terminal_settings
  - app_widget/terminal_tabs
  - app_plugin/client_info/client_info
  - app_plugin/client_info/client_info_platform_interface
  - app_plugin/client_info/client_info_android
  - app_plugin/client_info/client_info_ios
  - app_plugin/client_info/client_info_linux
  - app_plugin/client_info/client_info_macos
  - app_plugin/client_info/client_info_windows
  - third_party/form_bloc
  - third_party/flutter_form_bloc
  - third_party/flutter_adaptive_scaffold
  - third_party/settings_ui
  - third_party/gsmlg_security
  - third_party/gsmlg_ssh
  - third_party/gsmlg_utils
  - third_party/flex_tabs

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  logging: ^1.3.0

  go_router: ^17.0.1

  bloc: ^9.0.0
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7

  shared_preferences: ^2.3.5
  path_provider: ^2.1.5
  path: any

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.16
  lottie: ^3.3.1
  google_fonts: ^6.2.1

  # Terminal emulation
  xterm: ^4.0.0
  flutter_pty: any

  # Code editor and highlighting
  code_text_field: ^1.0.2
  highlight: ^0.7.0
  flutter_highlight: ^0.7.0

  # Data grid
  syncfusion_flutter_datagrid: ^29.2.4

  # State management (additional)
  flutter_riverpod: ^2.0.0
  flutter_state_notifier: ^1.0.0

  # Security
  flutter_secure_storage: ^9.0.0

  # Window and UI
  window_manager: ^0.5.0
  macos_ui: ^2.0.5
  context_menus: ^2.0.0+1
  flex_tabs: any
  font_awesome_flutter: ^10.2.1
  flutter_acrylic: ^1.0.0+2

  # Utilities
  file: ^7.0.0
  uuid: any
  meta: any
  collection: ^1.16.0

  # workspace packages
  app_database: any
  app_theme: any
  app_locale: any
  app_provider: any
  theme_bloc: any
  connection_bloc: any
  ssh_key_bloc: any
  ssh_host_bloc: any
  terminal_tab_bloc: any
  app_artwork: any
  app_client_info: any
  app_feedback: any
  app_adaptive_widgets: any
  settings_ui: any
  app_logging: any
  app_web_view: any
  form_bloc: any
  flutter_form_bloc: any
  terminal_core: any
  terminal_hosts: any
  terminal_tabs: any
  terminal_settings: any

  # External packages from original monorepo (copied to third_party)
  gsmlg_security: any
  gsmlg_ssh: any
  gsmlg_utils: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.26.3
  analyzer: any

  flutter_lints: ^6.0.0

  build_runner: ^2.4.15

  # Code generation
  go_router_builder: ^3.0.0

  # App packaging and icons
  flutter_launcher_icons: ^0.14.1
  icons_launcher: ^3.0.0
  msix: ^3.6.6

  melos: ^7.0.0
  mason: ^0.1.1
  mason_cli: ^0.1.1
  dependency_validator: ^5.0.2

flutter:
  generate: false
  uses-material-design: true

# generate icon with `dart run flutter_launcher_icons:main``
flutter_launcher_icons:
  image_path: "app_widget/artwork/assets/icon/app-icon.png"
  android: true
  ios: true
  min_sdk_android: 21
  windows:
    generate: true
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true

melos:
  name: web_terminal
  command:
    version:
      # Only allow versioning to happen on main branch.
      branch: main
      # Generates a link to a prefilled GitHub release creation page.
      releaseUrl: true

  scripts:
    prepare:
      description: Prepare project with `bootstrap`, `build_runner build` and `gen-l10n`
      steps:
        - melos bootstrap
        - melos run gen-l10n
        - melos run build-runner

    build-runner:
      run: dart run build_runner build --delete-conflicting-outputs
      exec:
        orderDependents: true
      description: Run `dart/flutter analyze` for all packages.

    analyze:
      description: Run `dart/flutter analyze` for all packages.
      steps:
        - melos run analyze:dart
        - melos run analyze:flutter

    analyze:dart:
      run: dart analyze --fatal-warnings
      exec:
        concurrency: 1
        orderDependents: true
      packageFilters:
        flutter: false
      description: Run `dart analyze` for non-Flutter packages.

    analyze:flutter:
      run: flutter analyze --fatal-warnings
      exec:
        concurrency: 1
        orderDependents: true
      packageFilters:
        flutter: true
      description: Run `flutter analyze` for Flutter packages.

    fix:
      run: dart fix . --apply
      exec:
        orderDependents: true
      description: Run `dart fix` for all packages.

    fix-dry-run:
      run: dart fix . --dry-run
      exec:
        orderDependents: true
      description: Run `dart fix` in dry-run mode for all packages.

    format:
      run: dart format .
      exec:
        orderDependents: true
      description: Run `dart format` for all packages.

    format-check:
      run: dart format . --set-exit-if-changed
      exec:
        orderDependents: true
      description: Run `dart format` checks for all packages.

    upgrade:
      run: dart pub upgrade --major-versions
      exec:
        orderDependents: true
      description: Run `flutter pub upgrade` update dependencies in all packages.

    outdated:
      run: dart pub outdated
      exec:
        orderDependents: true
      description: Run `flutter pub outdated` check outdated dependencies in all packages.

    validate-dependencies:
      run: dart run dependency_validator
      description: Run `dart run dependency_validator` check dependencies usage.

    test:
      run: melos exec --order-dependents --fail-fast flutter test || true
      description: Run Flutter tests for all packages (ignores packages without tests).
      steps:
        - melos run test:dart
        - melos run test:flutter

    test:dart:
      run: dart test
      exec:
        orderDependents: true
        fail-fast: true
      packageFilters:
        flutter: false
        dirExists: test

    test:flutter:
      run: flutter test
      exec:
        orderDependents: true
        fail-fast: true
      packageFilters:
        flutter: true
        dirExists: test

    gen-l10n:
      run: flutter gen-l10n
      exec:
        orderDependents: true
      packageFilters:
        flutter: true
        fileExists: l10n.yaml
      description: Generate localization files from ARB files.

