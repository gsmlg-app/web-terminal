name: terminal_settings
description: Terminal settings UI components
version: 1.0.0
publish_to: "none"

environment:
  sdk: ">=3.6.0 <4.0.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: any
  settings_ui: any
  flutter_form_bloc: any
  app_theme: any
