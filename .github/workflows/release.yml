name: Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - 'android'
          - 'ios'
          - 'linux'
          - 'macos'
          - 'all'
      build-name:
        required: true
        description: 'Version number (x.y.z), matching pubspec.yaml'
        default: '1.0.2'
      release-notes:
        required: false
        description: 'Release notes (leave empty to auto-generate from commits)'
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.build-name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  RELEASE_VERSION: ${{ inputs.build-name }}
  RELEASE_PLATFORM: ${{ inputs.platform }}

jobs:
  preflight:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Validate version and reject existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Version must use x.y.z without a prefix or suffix.' >&2
            exit 1
          fi
          manifest_version="$(sed -n 's/^version: *//p' pubspec.yaml)"
          if [[ "${manifest_version%+*}" != "$RELEASE_VERSION" || ! "${manifest_version##*+}" =~ ^[1-9][0-9]*$ ]]; then
            echo "pubspec.yaml version must be $RELEASE_VERSION with a positive build number." >&2
            exit 1
          fi
          tag="v$RELEASE_VERSION"
          existing_tag="$(git ls-remote --tags origin "refs/tags/$tag")"
          if [[ -n "$existing_tag" ]]; then
            echo "Tag $tag already exists; existing releases are immutable." >&2
            exit 1
          fi
          status="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/existing-release.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
          case "$status" in
            404) ;;
            200) echo "Release $tag already exists." >&2; exit 1 ;;
            *) echo "Release lookup failed with HTTP $status." >&2; exit 1 ;;
          esac

  test:
    name: Run Tests
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          lfs: true

      - uses: flutter-actions/setup-flutter@v4
        with:
          version: '3.47.7'

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Install tools
        run: dart pub global activate melos

      - name: Prepare project
        run: melos run prepare

      - name: Verify Android shell artifacts offline
        run: python3 -m unittest discover -s app_plugin/android_shell/scripts -p 'test_*.py' -v

      - name: Run analyze
        run: melos run analyze

      - name: Run tests
        run: melos run test

  build-android:
    if: inputs.platform == 'android' || inputs.platform == 'all'
    name: Build Android
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          lfs: true

      - name: Free disk space for Android build
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: flutter-actions/setup-flutter@v4
        with:
          version: '3.47.7'

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Install tools
        run: dart pub global activate melos

      - name: Prepare project
        run: melos run prepare

      - name: Build Android
        run: flutter build apk --release

      - name: Verify packaged Android shell artifacts
        run: python3 app_plugin/android_shell/scripts/verify_apk_artifacts.py build/app/outputs/flutter-apk/app-release.apk

      - name: Package Android
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk "release-assets/web-terminal-$RELEASE_VERSION-android-debug-signed.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release-assets/web-terminal-${{ inputs.build-name }}-android-debug-signed.apk
          if-no-files-found: error

  build-ios:
    if: inputs.platform == 'ios' || inputs.platform == 'all'
    name: Build iOS
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          lfs: true

      - uses: flutter-actions/setup-flutter@v4
        with:
          version: '3.47.7'

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Install tools
        run: dart pub global activate melos

      - name: Prepare project
        run: melos run prepare

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Package iOS
        run: |
          mkdir -p release-assets build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r "$GITHUB_WORKSPACE/release-assets/web-terminal-$RELEASE_VERSION-ios-unsigned.ipa" Payload

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: release-assets/web-terminal-${{ inputs.build-name }}-ios-unsigned.ipa
          if-no-files-found: error

  build-linux:
    if: inputs.platform == 'linux' || inputs.platform == 'all'
    name: Build Linux
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          lfs: true

      - uses: flutter-actions/setup-flutter@v4
        with:
          version: '3.47.7'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Install tools
        run: dart pub global activate melos

      - name: Prepare project
        run: melos run prepare

      - name: Build Linux
        run: flutter build linux --release

      - name: Package Linux
        run: |
          mkdir -p release-assets
          tar -czf "release-assets/web-terminal-$RELEASE_VERSION-linux-x64.tar.gz" -C build/linux/x64/release/bundle .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release-assets/web-terminal-${{ inputs.build-name }}-linux-x64.tar.gz
          if-no-files-found: error

  build-macos:
    if: inputs.platform == 'macos' || inputs.platform == 'all'
    name: Build macOS
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          lfs: true

      - uses: flutter-actions/setup-flutter@v4
        with:
          version: '3.47.7'

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Install tools
        run: dart pub global activate melos

      - name: Prepare project
        run: melos run prepare

      - name: Build macOS
        env:
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: 'NO'
        run: flutter build macos --release

      - name: Package macOS
        run: |
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/WebTerminal.app "release-assets/web-terminal-$RELEASE_VERSION-macos-unsigned.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: release-assets/web-terminal-${{ inputs.build-name }}-macos-unsigned.zip
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: [test, build-android, build-ios, build-linux, build-macos]
    if: >-
      always() && needs.test.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify selected artifacts
        run: |
          set -euo pipefail
          expected=()
          for platform in android ios linux macos; do
            if [[ "$RELEASE_PLATFORM" != all && "$RELEASE_PLATFORM" != "$platform" ]]; then
              continue
            fi
            case "$platform" in
              android) suffix=android-debug-signed.apk ;;
              ios) suffix=ios-unsigned.ipa ;;
              linux) suffix=linux-x64.tar.gz ;;
              macos) suffix=macos-unsigned.zip ;;
            esac
            asset="release-assets/web-terminal-$RELEASE_VERSION-$suffix"
            test -s "$asset"
            expected+=("$asset")
          done
          shopt -s nullglob
          actual=(release-assets/*)
          test "${#actual[@]}" -eq "${#expected[@]}"
          (cd release-assets && sha256sum "${expected[@]#release-assets/}") > release-assets/SHA256SUMS

      - name: Generate release notes
        env:
          RELEASE_NOTES: ${{ inputs.release-notes }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_NOTES" ]]; then
            printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.md"
          else
            printf "## What's Changed\n\n" > "$RUNNER_TEMP/release-notes.md"
            previous_tag="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
            if [[ -n "$previous_tag" ]]; then
              git log "$previous_tag..HEAD" --pretty=format:'- %s' --no-merges >> "$RUNNER_TEMP/release-notes.md"
            else
              git log -10 --pretty=format:'- %s' --no-merges >> "$RUNNER_TEMP/release-notes.md"
            fi
          fi
          {
            printf '\n\n## Artifacts\n\n'
            printf 'Built from commit `%s` with version `%s`.\n\n' "$GITHUB_SHA" "$RELEASE_VERSION"
            if [[ "$RELEASE_PLATFORM" == all || "$RELEASE_PLATFORM" == android ]]; then
              printf '%s\n' '- Android APK uses a debug signing certificate; it is not a Play Store distribution build.'
            fi
            if [[ "$RELEASE_PLATFORM" == all || "$RELEASE_PLATFORM" == ios ]]; then
              printf '%s\n' '- iOS IPA is unsigned and requires signing and provisioning before installation.'
            fi
            if [[ "$RELEASE_PLATFORM" == all || "$RELEASE_PLATFORM" == macos ]]; then
              printf '%s\n' '- macOS app is unsigned and not notarized.'
            fi
            printf '%s\n' '- SHA256SUMS lists the checksums of the attached platform archives.'
          } >> "$RUNNER_TEMP/release-notes.md"

      - name: Tag exact commit and publish assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          existing_tag="$(git ls-remote --tags origin "refs/tags/$tag")"
          if [[ -n "$existing_tag" ]]; then
            echo "Tag $tag already exists; refusing to overwrite it." >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" "$GITHUB_SHA" -m "Release $tag"
          git push origin "refs/tags/$tag"
          gh release create "$tag" --verify-tag --title "WebTerminal $tag" \
            --notes-file "$RUNNER_TEMP/release-notes.md" release-assets/*
